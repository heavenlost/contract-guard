name: contract-guard-ci

on:
  pull_request:
    paths:
      - "**/*.sol"
      - "foundry.toml"
      - "remappings.txt"
      - ".contract-guard-baseline.json"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/contract-guard-ci.yml"
  workflow_dispatch:

jobs:
  security-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 resolved 2026-05-10
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-05-10
        with:
          python-version: "3.12"
      - name: Install Contract Guard CI
        run: pip install -e .
      - name: Probe repository
        run: contract-guard plan --repo . --json
      - name: Run deterministic scan
        run: |
          set +e
          set -u -o pipefail
          mkdir -p contract-guard-reports

          scan_args=(--repo . --changed-only --baseline-file .contract-guard-baseline.json)
          if [ -n "${{ github.base_ref }}" ]; then
            scan_args+=(--diff-base "origin/${{ github.base_ref }}...HEAD")
          fi

          contract-guard scan "${scan_args[@]}" --format json > contract-guard-reports/scan.json
          scan_status=$?
          contract-guard scan "${scan_args[@]}" --fail-on-severity none --format markdown > contract-guard-reports/scan.md
          contract-guard scan "${scan_args[@]}" --fail-on-severity none --format sarif > contract-guard-reports/scan.sarif
          exit "$scan_status"
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3 resolved 2026-05-10
        with:
          sarif_file: contract-guard-reports/scan.sarif
      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-05-10
        with:
          name: contract-guard-reports
          path: contract-guard-reports/
